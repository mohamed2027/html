<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hotel warehouse, purchasing and approvals system / نظام المخازن والمشتريات الفندقية">
<title>Hotel Warehouse · المخازن الفندقية</title>
<style>
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --border: #dde3ee;
  --text: #1c2536;
  --muted: #6b7690;
  --primary: #1f6feb;
  --primary-text: #ffffff;
  --accent: #0ea5a4;
  --success: #15803d;
  --warning: #b45309;
  --danger: #c2410c;
  --shadow: 0 6px 20px rgba(20, 35, 70, .08);
  --sidebar: #0f1b33;
  --sidebar-text: #c9d4ea;
  --sidebar-active: #1f6feb;
  --radius: 12px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b1220;
  --surface: #131d33;
  --surface-2: #18243f;
  --border: #26345a;
  --text: #e6ecf8;
  --muted: #94a3c4;
  --primary: #4f8ff7;
  --primary-text: #0b1220;
  --accent: #2dd4bf;
  --success: #4ade80;
  --warning: #fbbf24;
  --danger: #fb7c5b;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  --sidebar: #070e1d;
  --sidebar-text: #9fb0d3;
  --sidebar-active: #2563eb;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --surface: #131d33; --surface-2: #18243f; --border: #26345a;
    --text: #e6ecf8; --muted: #94a3c4; --primary: #4f8ff7; --primary-text: #0b1220;
    --accent: #2dd4bf; --success: #4ade80; --warning: #fbbf24; --danger: #fb7c5b;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35); --sidebar: #070e1d; --sidebar-text: #9fb0d3;
    --sidebar-active: #2563eb; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px;
}
h1, h2, h3 { margin: 0 0 12px; font-weight: 700; }
h1 { font-size: 22px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
a { color: var(--primary); }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; direction: ltr; text-align: end; unicode-bidi: plaintext; }

/* ---------- Layout ---------- */
#app { display: flex; min-height: 100vh; }
.sidebar {
  width: 250px; background: var(--sidebar); color: var(--sidebar-text);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; flex-shrink: 0;
}
.brand { padding: 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand .logo { font-size: 18px; font-weight: 800; color: #fff; }
.brand .sub { font-size: 12px; margin-top: 4px; opacity: .75; }
.nav { padding: 10px 8px; overflow-y: auto; flex: 1; }
.nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .55; padding: 14px 12px 6px; }
.nav button {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 2px 0;
  background: transparent; border: 0; color: inherit; border-radius: 9px; cursor: pointer;
  font: inherit; text-align: start;
}
.nav button:hover { background: rgba(255,255,255,.07); }
.nav button.active { background: var(--sidebar-active); color: #fff; }
.nav .ico { width: 20px; text-align: center; }
.sidebar-foot { padding: 12px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 5;
}
.topbar .who { display: flex; align-items: center; gap: 10px; }
.content { padding: 22px 24px 40px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

/* ---------- Cards / grids ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; min-width: 0;
}
.grid { display: grid; gap: 16px; }
.grid.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.kpi .label { color: var(--muted); font-size: 12px; }
.kpi .value { font-size: 26px; font-weight: 800; margin-top: 6px; }
.kpi .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.kpi.warn .value { color: var(--warning); }
.kpi.danger .value { color: var(--danger); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .grow { flex: 1; }

/* ---------- Buttons / inputs ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  font: inherit; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { filter: brightness(1.05); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); font-weight: 700; }
.btn.success { background: var(--success); border-color: var(--success); color: #fff; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { background: transparent; border: 0; color: inherit; cursor: pointer; font-size: 18px; padding: 6px; border-radius: 8px; }
.icon-btn:hover { background: var(--surface-2); }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 11px; width: 100%; min-width: 0;
}
input[type="checkbox"] { width: auto; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 0; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
label.field.inline { flex-direction: row; align-items: center; color: var(--text); }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
.actions { display: flex; gap: 10px; justify-content: flex-start; flex-wrap: wrap; margin-top: 14px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 11px; border-bottom: 1px solid var(--border); text-align: start; vertical-align: middle; }
th { background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(127,127,127,.05); }
td.num, th.num { text-align: end; }
.empty { text-align: center; color: var(--muted); padding: 26px; }
.badge {
  display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
}
.badge.ok { color: var(--success); border-color: var(--success); }
.badge.warn { color: var(--warning); border-color: var(--warning); }
.badge.bad { color: var(--danger); border-color: var(--danger); }
.badge.info { color: var(--primary); border-color: var(--primary); }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar > span { display: block; height: 100%; background: var(--primary); }

/* ---------- Modal / toast / banner ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(5, 10, 20, .55); display: flex; align-items: center;
  justify-content: center; padding: 16px; z-index: 50;
}
.modal {
  background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); width: min(860px, 100%); max-height: 92vh; overflow: auto; padding: 20px;
}
.modal.narrow { width: min(460px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
#toasts { position: fixed; bottom: 18px; inset-inline-start: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
.toast { background: var(--sidebar); color: #fff; padding: 11px 16px; border-radius: 10px; box-shadow: var(--shadow); max-width: 360px; }
.toast.err { background: #7f1d1d; }
.banner { padding: 12px 16px; border-radius: 10px; border: 1px solid var(--warning); background: color-mix(in srgb, var(--warning) 14%, transparent); margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.banner.danger { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }

/* ---------- Login / setup ---------- */
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--primary) 25%, transparent), transparent 55%), var(--bg); }
.auth-card { width: min(420px, 100%); }
.auth-card .logo { font-size: 22px; font-weight: 800; margin-bottom: 4px; }

/* ---------- Misc ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
.tabs button { background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; color: var(--muted); font: inherit; cursor: pointer; }
.tabs button.active { color: var(--text); border-bottom-color: var(--primary); font-weight: 700; }
.lines .line-row { display: grid; gap: 8px; grid-template-columns: 2.2fr 1fr 1fr 1fr auto; align-items: center; margin-bottom: 8px; }
.lines .line-row select, .lines .line-row input { min-width: 0; }
.lines-head { font-size: 12px; color: var(--muted); margin: 6px 0; }
.doc-meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.step { border: 1px dashed var(--border); border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 150px; }
.step.done { border-style: solid; border-color: var(--success); }
.step.rejected { border-style: solid; border-color: var(--danger); }
.perm-matrix td:first-child { text-align: start; }
.perm-matrix td, .perm-matrix th { text-align: center; }
.perm-matrix td:first-child, .perm-matrix th:first-child { text-align: start; }
.drop { border: 2px dashed var(--border); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); }
.codebox { font-family: Consolas, "Courier New", monospace; font-size: 12px; word-break: break-all; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 10px; direction: ltr; text-align: end; }

@media (max-width: 900px) {
  #app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; }
  .nav { display: flex; overflow-x: auto; gap: 4px; padding: 6px; }
  .nav-group { display: none; }
  .nav button { width: auto; white-space: nowrap; }
  .content { padding: 16px; }
  .topbar { padding: 12px 16px; }
  .lines .line-row { grid-template-columns: 1fr 1fr; }
}

@media print {
  .sidebar, .topbar, .no-print, #toasts { display: none !important; }
  body { background: #fff; color: #000; }
  .card { box-shadow: none; border: 0; padding: 0; }
  .content { padding: 0; }
  th { position: static; background: #eee; color: #000; }
  .table-wrap { border: 0; overflow: visible; }
}

/* ---------- Application shell (sidebar + main) ---------- */
#shell { display: flex; min-height: 100vh; width: 100%; }
@media (max-width: 900px) { #shell { flex-direction: column; } }

/* ---------- Executive dashboard ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: 16px; padding: 22px 24px; margin-bottom: 18px;
  color: #fff; background: linear-gradient(120deg, #0f1b33 0%, #1d4ed8 55%, #0ea5a4 110%);
  box-shadow: var(--shadow);
}
.hero::after {
  content: ""; position: absolute; inset-inline-end: -60px; top: -60px; width: 260px; height: 260px;
  border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.22), transparent 70%);
}
.hero h1 { color: #fff; margin: 0 0 4px; }
.hero .sub { opacity: .85; font-size: 13px; }
.hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero .quick { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .btn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.25); color: #fff; }
.hero .btn.primary { background: #fff; color: #0f1b33; border-color: #fff; }

.kpi-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 18px; }
.kpi-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px 18px; display: flex; gap: 14px; align-items: center; min-width: 0;
}
.kpi-icon {
  width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0;
  background: color-mix(in srgb, var(--c, #1f6feb) 16%, transparent); color: var(--c, #1f6feb);
}
.kpi-card .k-label { color: var(--muted); font-size: 12px; }
.kpi-card .k-value { font-size: 24px; font-weight: 800; line-height: 1.2; margin-top: 2px; }
.kpi-card .k-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

.dash-grid { display: grid; gap: 18px; grid-template-columns: 1.6fr 1fr; margin-bottom: 18px; }
.dash-grid.equal { grid-template-columns: 1fr 1fr; }
@media (max-width: 1100px) { .dash-grid, .dash-grid.equal { grid-template-columns: 1fr; } }

.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.panel-head h3 { margin: 0; }
.chart-svg { width: 100%; height: auto; display: block; }
.chart-svg text { fill: var(--muted); font-size: 11px; }
.chart-svg .grid-line { stroke: var(--border); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: middle; }

.donut-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
.donut-legend { display: grid; gap: 8px; min-width: 160px; flex: 1; }
.donut-legend .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }

.feed { display: grid; gap: 10px; }
.feed-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.feed-dot { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; font-size: 16px; background: color-mix(in srgb, var(--c, #1f6feb) 16%, transparent); color: var(--c, #1f6feb); }
.feed-item .t { font-weight: 700; font-size: 13px; }
.feed-item .d { font-size: 12px; color: var(--muted); margin-top: 2px; }

.progress-row { display: grid; gap: 4px; margin-bottom: 12px; }
.progress-row .top { display: flex; justify-content: space-between; font-size: 13px; }
.bar.thick { height: 10px; }
.bar > span.warn { background: var(--warning); }
.bar > span.bad { background: var(--danger); }
.bar > span.ok { background: var(--success); }

.stock-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.stock-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.company-sel { width: 100%; margin-top: 10px; }

</style>
</head>
<body>
<noscript><p style="padding:24px">This application requires JavaScript. / هذا التطبيق يتطلب تفعيل JavaScript.</p></noscript>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<script>
/* ===== App configuration (edit before building for sale) ===== */
const APP = {
  version: '1.0.0',
  storageKey: 'hwm.data.v1',          // company 'main' (legacy key); other companies use storageKey + '.' + id
  companiesKey: 'hwm.companies.v1',   // registry of companies on this device
  lastCompanyKey: 'hwm.lastCompany',
  licenseKey: 'hwm.license.v1',
  trialKey: 'hwm.trial.v1',
  machineKey: 'hwm.machine.v1',
  langKey: 'hwm.lang',
  themeKey: 'hwm.theme',
  reminderKey: 'hwm.reminder.v1',
  trialDays: 30,               // free trial length
  reminderEveryDays: 3,        // remind every N days
  reminderLeadDays: 30,        // start reminding this many days before expiry
  // Ed25519 PUBLIC key (raw, base64) produced by tools/license-keygen.html.
  // The private key never goes into the app. Replace this placeholder before selling.
  licensePublicKey: 'REPLACE_WITH_PUBLIC_KEY_FROM_KEYGEN',
};

/* ===== Core: helpers, storage, dialogs, crypto ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pad = (n, w = 4) => String(n).padStart(w, '0');

function localDate(d = new Date()) {
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
const todayISO = () => localDate();
const nowIso = () => new Date().toISOString();
const dt = (iso) => (iso ? String(iso).slice(0, 10) : '');
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return localDate(d); }
function daysBetween(fromIso, toIso) { return Math.round((new Date(toIso + 'T00:00:00') - new Date(fromIso + 'T00:00:00')) / 86400000); }
const num = (v) => {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const n = parseFloat(String(v ?? '').replace(/,/g, '').trim());
  return isFinite(n) ? n : 0;
};
const qty = (n) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 3 });
const money = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ----- Local storage (wrapped: may be blocked or full) ----- */
const Store = {
  get(k, fb = null) { try { const v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); } catch (e) { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { console.error(e); return false; } },
  remove(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
};
const Session = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* ignore */ } },
  remove(k) { try { sessionStorage.removeItem(k); } catch (e) { /* ignore */ } },
};

/* ----- Toasts ----- */
function toast(msg, kind = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'err' ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

/* ----- Modal dialogs ----- */
function openModal({ title, body, actions = [], narrow = false, onOpen }) {
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `
    <div class="modal ${narrow ? 'narrow' : ''}" role="dialog" aria-modal="true">
      <div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-x aria-label="close">✕</button></div>
      <div class="modal-body">${body}</div>
      <div class="actions">${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-a="${i}">${a.label}</button>`).join('')}</div>
    </div>`;
  const close = () => wrap.remove();
  const ctx = { el: wrap, close };
  wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
  wrap.querySelector('[data-x]').onclick = close;
  wrap.querySelectorAll('[data-a]').forEach((b) => {
    b.onclick = async () => {
      const a = actions[+b.dataset.a];
      try {
        const r = await a.onClick(ctx);
        if (r !== false) close();
      } catch (err) {
        toast(err.message || String(err), 'err');
      }
    };
  });
  $('#modal-root').appendChild(wrap);
  if (onOpen) onOpen(ctx);
  setTimeout(() => { const f = wrap.querySelector('input,select,textarea'); if (f) f.focus(); }, 40);
  return ctx;
}
function confirmBox(message, onYes) {
  openModal({
    title: t('common.confirm'),
    narrow: true,
    body: `<p>${esc(message)}</p>`,
    actions: [
      { label: t('common.cancel'), cls: 'ghost', onClick: () => {} },
      { label: t('common.yes'), cls: 'danger', onClick: onYes },
    ],
  });
}

/* ----- Crypto (PBKDF2 for passwords, base64 helpers) ----- */
const b64 = (bytes) => { let s = ''; bytes.forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); };
const unb64 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
async function pbkdf2(password, saltBytes) {
  if (!window.crypto || !crypto.subtle) throw new Error(t('msg.noCrypto'));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: saltBytes, iterations: 120000, hash: 'SHA-256' }, key, 256);
  return b64(new Uint8Array(bits));
}
async function makePasswordRecord(password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return { salt: b64(salt), hash: await pbkdf2(password, salt) };
}
async function checkPasswordRecord(password, rec) {
  if (!rec) return false;
  return (await pbkdf2(password, unb64(rec.salt))) === rec.hash;
}

/* ----- Language state & helpers ----- */
const LANG = { current: 'ar' };
function t(key, vars) {
  const pair = I18N[key];
  let s = pair ? pair[LANG.current === 'ar' ? 0 : 1] : key;
  if (vars) Object.keys(vars).forEach((k) => { s = s.split('{' + k + '}').join(String(vars[k])); });
  return s;
}
// Bilingual entity name: prefers current language, falls back to the other one.
function nm(o) {
  if (!o) return '';
  if (typeof o === 'string') return o;
  return LANG.current === 'ar' ? (o.ar || o.en || o.name || '') : (o.en || o.ar || o.name || '');
}
function setLang(l) {
  LANG.current = l === 'en' ? 'en' : 'ar';
  Store.set(APP.langKey, LANG.current);
  document.documentElement.lang = LANG.current;
  document.documentElement.dir = LANG.current === 'ar' ? 'rtl' : 'ltr';
  document.title = t('app.name') + ' · ' + (LANG.current === 'ar' ? 'المخازن' : 'Warehouse');
}

/* ===== Minimal XLSX reader/writer (no external library, works offline) ===== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const xmlEsc = (s) => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function colName(i) {
  let s = '';
  let n = i + 1;
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function colIndex(letters) {
  let n = 0;
  for (const ch of letters.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function safeSheetName(n, i) {
  const s = String(n || '').replace(/[\[\]\*\?\/\\:]/g, ' ').slice(0, 31).trim();
  return s || ('Sheet' + (i + 1));
}

const XL_STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
  + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
  + '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>'
  + '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
  + '<fill><patternFill patternType="solid"><fgColor rgb="FF1F4E79"/><bgColor indexed="64"/></patternFill></fill></fills>'
  + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
  + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
  + '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
  + '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf></cellXfs>'
  + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
  + '</styleSheet>';

function xlSheetXml(sheet) {
  const rows = sheet.rows || [];
  let maxCols = 0;
  rows.forEach((r) => { if (r.length > maxCols) maxCols = r.length; });
  const cols = [];
  for (let c = 0; c < maxCols; c++) {
    let w = 10;
    for (let r = 0; r < rows.length; r++) {
      const len = String(rows[r][c] ?? '').length;
      if (len > w) w = len;
    }
    cols.push('<col min="' + (c + 1) + '" max="' + (c + 1) + '" width="' + Math.min(48, w + 3) + '" customWidth="1"/>');
  }
  const body = rows.map((r, ri) => {
    const cells = r.map((v, ci) => {
      if (v === null || v === undefined || v === '') return '';
      const ref = colName(ci) + (ri + 1);
      const style = (sheet.header && ri === 0) ? ' s="1"' : '';
      if (typeof v === 'number' && isFinite(v)) return '<c r="' + ref + '"' + style + '><v>' + v + '</v></c>';
      return '<c r="' + ref + '" t="inlineStr"' + style + '><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>';
    }).join('');
    return '<row r="' + (ri + 1) + '">' + cells + '</row>';
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<sheetViews><sheetView workbookViewId="0"/></sheetViews>'
    + (cols.length ? '<cols>' + cols.join('') + '</cols>' : '')
    + '<sheetData>' + body + '</sheetData></worksheet>';
}

function zipStore(files) {
  const chunks = [];
  const central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const u16 = (n) => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = (n) => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];
  const enc = new TextEncoder();
  files.forEach((f) => {
    const nameBytes = enc.encode(f.name);
    const crc = crc32(f.data);
    const size = f.data.length;
    const local = new Uint8Array([].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0)));
    chunks.push(local, nameBytes, f.data);
    const cen = new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)));
    central.push(cen, nameBytes);
    offset += local.length + nameBytes.length + size;
  });
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const end = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cdSize), u32(offset), u16(0)));
  return new Blob([...chunks, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* sheets: [{ name, rows: [[...]], header: true }] → Blob (.xlsx) */
function xlWrite(sheets) {
  const enc = new TextEncoder();
  const files = [];
  const add = (name, text) => files.push({ name, data: enc.encode(text) });
  const names = sheets.map((s, i) => safeSheetName(s.name, i));
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  add('[Content_Types].xml', X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    + sheets.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
    + '</Types>');
  add('_rels/.rels', X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    + '</Relationships>');
  add('xl/workbook.xml', X + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    + '<sheets>' + names.map((n, i) => '<sheet name="' + xmlEsc(n) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets></workbook>');
  add('xl/_rels/workbook.xml.rels', X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + sheets.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('')
    + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    + '</Relationships>');
  add('xl/styles.xml', XL_STYLES);
  sheets.forEach((s, i) => add('xl/worksheets/sheet' + (i + 1) + '.xml', xlSheetXml(s)));
  return zipStore(files);
}

/* buffer (ArrayBuffer of .xlsx) → [{ name, rows: [[...]] }] */
async function xlRead(buffer) {
  const bytes = new Uint8Array(buffer);
  const dv = new DataView(buffer);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('bad zip');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = {};
  const dec = new TextDecoder();
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('bad central directory');
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true);
    const xlen = dv.getUint16(p + 30, true);
    const clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const name = dec.decode(bytes.subarray(p + 46, p + 46 + nlen));
    entries[name] = { method, csize, loff };
    p += 46 + nlen + xlen + clen;
  }
  const readEntry = async (name) => {
    const e = entries[name];
    if (!e) return null;
    const start = e.loff + 30 + dv.getUint16(e.loff + 26, true) + dv.getUint16(e.loff + 28, true);
    const data = bytes.subarray(start, start + e.csize);
    if (e.method === 0) return data;
    if (e.method === 8) {
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    throw new Error('unsupported zip method');
  };
  const text = async (name) => { const d = await readEntry(name); return d ? dec.decode(d) : null; };
  const parse = (s) => new DOMParser().parseFromString(s, 'application/xml');

  const shared = [];
  const sst = await text('xl/sharedStrings.xml');
  if (sst) {
    Array.from(parse(sst).getElementsByTagName('si')).forEach((si) => {
      shared.push(Array.from(si.getElementsByTagName('t')).map((x) => x.textContent).join(''));
    });
  }
  const wbText = await text('xl/workbook.xml');
  if (!wbText) throw new Error('no workbook');
  const relText = await text('xl/_rels/workbook.xml.rels');
  const relMap = {};
  if (relText) Array.from(parse(relText).getElementsByTagName('Relationship')).forEach((r) => { relMap[r.getAttribute('Id')] = r.getAttribute('Target'); });
  const sheets = Array.from(parse(wbText).getElementsByTagName('sheet')).map((s) => {
    const target = relMap[s.getAttribute('r:id')] || '';
    return { name: s.getAttribute('name'), target: target.startsWith('/') ? target.slice(1) : 'xl/' + target };
  });

  const out = [];
  for (const sh of sheets) {
    const sx = await text(sh.target);
    if (!sx) continue;
    const rows = [];
    Array.from(parse(sx).getElementsByTagName('row')).forEach((rowEl) => {
      const r = [];
      Array.from(rowEl.getElementsByTagName('c')).forEach((c) => {
        const ref = c.getAttribute('r') || '';
        const letters = ref.replace(/[0-9]/g, '');
        const ci = letters ? colIndex(letters) : r.length;
        const type = c.getAttribute('t');
        let val = '';
        if (type === 'inlineStr') {
          val = Array.from(c.getElementsByTagName('t')).map((x) => x.textContent).join('');
        } else {
          const vEl = c.getElementsByTagName('v')[0];
          const raw = vEl ? vEl.textContent : '';
          if (type === 's') val = shared[+raw] ?? '';
          else if (type === 'b') val = raw === '1' ? 'TRUE' : 'FALSE';
          else if (type === 'str' || type === 'e') val = raw;
          else if (raw !== '' && !isNaN(Number(raw))) val = Number(raw);
          else val = raw;
        }
        r[ci] = val;
      });
      rows.push(Array.from(r, (v) => (v === undefined ? '' : v)));
    });
    out.push({ name: sh.name, rows });
  }
  return out;
}

/* ----- Browser helpers for files ----- */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function downloadText(text, filename, type = 'application/json') {
  downloadBlob(new Blob([text], { type: type + ';charset=utf-8' }), filename);
}
function pickFile(accept) {
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    input.onchange = () => resolve(input.files && input.files[0] ? input.files[0] : null);
    input.click();
  });
}

/* ===== Licensing: 30-day trial, signed serial keys (Ed25519), renewal reminders ===== */
/*
  Key format:  HWM1.<payload base64url>.<signature base64url>
  payload JSON: { cust, plan, exp (YYYY-MM-DD or null = lifetime), mid ("*" or machine id), iss }
  Keys are created ONLY by tools/license-keygen.html, which holds the private key.
*/
const LIC_RULES = { trialReminderDays: 10 };   // trial reminders start this many days before trial ends
let _pubKeyPromise = null;

const b64u = {
  enc(bytes) {
    let s = '';
    bytes.forEach((b) => { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  dec(str) {
    const s = String(str).replace(/-/g, '+').replace(/_/g, '/');
    const pad = s.length % 4 ? '='.repeat(4 - (s.length % 4)) : '';
    return Uint8Array.from(atob(s + pad), (c) => c.charCodeAt(0));
  },
};

function getMachineId() {
  let id = Store.get(APP.machineKey, null);
  if (!id) {
    id = 'M' + uid().replace(/-/g, '').slice(0, 20).toUpperCase();
    Store.set(APP.machineKey, id);
  }
  return id;
}

function licenseConfigured() {
  return !!APP.licensePublicKey && !APP.licensePublicKey.startsWith('REPLACE');
}

function importPublicKey() {
  if (!_pubKeyPromise) {
    _pubKeyPromise = crypto.subtle.importKey('raw', unb64(APP.licensePublicKey), { name: 'Ed25519' }, false, ['verify']);
  }
  return _pubKeyPromise;
}

async function verifyLicenseKey(raw) {
  const key = String(raw || '').replace(/\s+/g, '');
  const parts = key.split('.');
  if (parts.length !== 3 || parts[0] !== 'HWM1') return { ok: false, reason: 'format' };
  if (!licenseConfigured()) return { ok: false, reason: 'notconfigured' };
  try {
    const pub = await importPublicKey();
    const sig = b64u.dec(parts[2]);
    const valid = await crypto.subtle.verify({ name: 'Ed25519' }, pub, sig, new TextEncoder().encode(parts[1]));
    if (!valid) return { ok: false, reason: 'signature' };
    const payload = JSON.parse(new TextDecoder().decode(b64u.dec(parts[1])));
    if (payload.mid && payload.mid !== '*' && payload.mid !== getMachineId()) return { ok: false, reason: 'machine' };
    return { ok: true, payload };
  } catch (e) {
    return { ok: false, reason: 'format' };
  }
}

/* Trial start is kept in localStorage AND a cookie; the earliest copy wins. */
function readCookie(name) {
  try {
    const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  } catch (e) { return null; }
}
function writeCookie(name, value) {
  try { document.cookie = name + '=' + encodeURIComponent(value) + '; max-age=' + (60 * 60 * 24 * 400) + '; path=/; SameSite=Lax'; } catch (e) { /* ignore */ }
}
function getTrialStart() {
  const candidates = [];
  const ls = Store.get(APP.trialKey, null);
  if (ls && /^\d{4}-\d{2}-\d{2}$/.test(ls.start || '')) candidates.push(ls.start);
  const ck = readCookie('hwm_t');
  if (ck && /^\d{4}-\d{2}-\d{2}$/.test(ck)) candidates.push(ck);
  const start = candidates.length ? candidates.sort()[0] : todayISO();
  Store.set(APP.trialKey, { start });
  writeCookie('hwm_t', start);
  return start;
}

/* Returns { status: 'LICENSED'|'TRIAL'|'EXPIRED', days, expiry, lifetime, customer, plan, reason } */
async function getLicenseStatus() {
  const today = todayISO();
  const saved = Store.get(APP.licenseKey, null);
  if (saved && saved.key) {
    const v = await verifyLicenseKey(saved.key);
    if (v.ok) {
      const p = v.payload;
      if (!p.exp) return { status: 'LICENSED', lifetime: true, customer: p.cust, plan: p.plan, expiry: null, days: null };
      const days = daysBetween(today, p.exp);
      if (days >= 0) return { status: 'LICENSED', lifetime: false, customer: p.cust, plan: p.plan, expiry: p.exp, days };
      return { status: 'EXPIRED', reason: 'license', customer: p.cust, plan: p.plan, expiry: p.exp, days };
    }
  }
  const start = getTrialStart();
  const used = daysBetween(start, today);
  const left = APP.trialDays - used;
  if (left > 0) return { status: 'TRIAL', days: left, expiry: addDays(start, APP.trialDays), lifetime: false };
  return { status: 'EXPIRED', reason: 'trial', days: 0, expiry: addDays(start, APP.trialDays), lifetime: false };
}

async function activateLicense(raw) {
  const v = await verifyLicenseKey(raw);
  if (!v.ok) {
    if (v.reason === 'notconfigured') throw new Error(t('lic.notConfigured'));
    if (v.reason === 'machine') throw new Error(t('lic.wrongMachine'));
    throw new Error(t('lic.invalid'));
  }
  Store.set(APP.licenseKey, { key: String(raw).replace(/\s+/g, ''), activatedAt: nowIso() });
  Store.remove(APP.reminderKey);
  return v.payload;
}

function deactivateLicense() { Store.remove(APP.licenseKey); }

/* Reminder rules: licences with an expiry remind during the lead window; trial reminds in its last days.
   The first reminder shows immediately; then one every APP.reminderEveryDays (3). */
function reminderDue(status) {
  if (!status) return false;
  if (status.status === 'LICENSED') {
    if (status.lifetime) return false;
    if (status.days > APP.reminderLeadDays) return false;
  } else if (status.status === 'TRIAL') {
    if (status.days > LIC_RULES.trialReminderDays) return false;
  } else {
    return false;   // expired is handled by the lock screen
  }
  const rec = Store.get(APP.reminderKey, {});
  if (!rec.last) return true;
  return daysBetween(rec.last, todayISO()) >= APP.reminderEveryDays;
}
function markReminderShown() { Store.set(APP.reminderKey, { last: todayISO() }); }

/* ===== Companies: each company keeps its own data, users and warehouses on this device ===== */
let COMPANIES = [];   // registry: [{ id, key, nameAr, nameEn, createdAt }]
let COMPANY = null;   // record of the company that is open now

const companyLabel = (c) => nm({ ar: c.nameAr, en: c.nameEn }) || t('co.unnamed');
const companyOptions = () => COMPANIES.map((c) => ({ v: c.id, l: companyLabel(c) }));
function dataKey() { return COMPANY ? COMPANY.key : APP.storageKey; }

/* Reads the registry. Data saved by the earlier single-company version becomes the company 'main'. */
function loadCompanies() {
  let list = Store.get(APP.companiesKey, null);
  if (!Array.isArray(list)) {
    list = [];
    const legacy = Store.get(APP.storageKey, null);
    if (legacy && legacy.schema === 1) {
      const st = legacy.settings || {};
      list.push({ id: 'main', key: APP.storageKey, nameAr: st.hotelAr || '', nameEn: st.hotelEn || '', createdAt: nowIso() });
    }
    Store.set(APP.companiesKey, list);
  }
  return list;
}
function saveCompanies() {
  if (!Store.set(APP.companiesKey, COMPANIES)) toast(t('msg.storage'), 'err');
}

/* Opens a company: loads its data and restores the signed-in user if this tab already had one. */
async function selectCompany(id) {
  const rec = COMPANIES.find((c) => c.id === id);
  if (!rec) throw new Error(t('co.notFound'));
  COMPANY = rec;
  Session.set('hwm.cid', rec.id);
  Store.set(APP.lastCompanyKey, rec.id);
  S = loadState();
  CURRENT = null;
  if (S) {
    await ensureAdministrator();
    const sid = Session.get('hwm.uid');
    CURRENT = S.users.find((u) => u.id === sid && u.active !== false) || null;
  }
}

/* Saves and leaves the open company, then opens another one. Its users must sign in again. */
async function switchToCompany(id) {
  if (S) {
    if (CURRENT) audit('logout', CURRENT.username);
    saveState();
  }
  CURRENT = null;
  Session.remove('hwm.uid');
  await selectCompany(id);
  go('dashboard');
  renderApp();
}

/* Creates a company with its own default administrator. The company that is open stays open. */
async function createCompany(d) {
  const ar = String(d.hotelAr || '').trim();
  const en = String(d.hotelEn || '').trim();
  if (!ar && !en) throw new Error(t('common.required'));
  const rec = { id: uid(), key: '', nameAr: ar, nameEn: en, createdAt: nowIso() };
  rec.key = APP.storageKey + '.' + rec.id;
  const prev = { company: COMPANY, state: S, user: CURRENT };
  const restore = () => { COMPANY = prev.company; S = prev.state; CURRENT = prev.user; };
  COMPANY = rec;
  try {
    S = await createInitialState(ar, en, String(d.currency || 'EGP').trim() || 'EGP');
    CURRENT = S.users[0];
    if (d.sample) loadSampleData();
    audit('setup', 'company created');
    saveState();
  } catch (e) {
    restore();
    throw e;
  }
  restore();
  COMPANIES.push(rec);
  saveCompanies();
  return rec;
}

/* Deletes a company's data. The open company cannot be deleted; open another one first. */
function removeCompany(id) {
  const rec = COMPANIES.find((c) => c.id === id);
  if (!rec) return;
  if (COMPANY && COMPANY.id === id) throw new Error(t('co.cantDeleteCurrent'));
  Store.remove(rec.key);
  COMPANIES = COMPANIES.filter((c) => c.id !== id);
  saveCompanies();
  if (Store.get(APP.lastCompanyKey, null) === id) Store.remove(APP.lastCompanyKey);
}

/* Renames a company. The open company's settings are updated in place; others are updated in storage. */
function renameCompany(id, hotelAr, hotelEn) {
  const ar = String(hotelAr || '').trim();
  const en = String(hotelEn || '').trim();
  if (!ar && !en) throw new Error(t('common.required'));
  const rec = COMPANIES.find((c) => c.id === id);
  if (!rec) throw new Error(t('co.notFound'));
  rec.nameAr = ar;
  rec.nameEn = en;
  saveCompanies();
  if (COMPANY && COMPANY.id === id) {
    S.settings.hotelAr = ar;
    S.settings.hotelEn = en;
    audit('settings.save', 'company name');
    saveState();
  } else {
    const st = Store.get(rec.key, null);
    if (st && st.settings) { st.settings.hotelAr = ar; st.settings.hotelEn = en; Store.set(rec.key, st); }
  }
}

/* Keeps the registry name in step with the settings page for the open company. */
function syncCompanyName() {
  if (!COMPANY || !S) return;
  COMPANY.nameAr = S.settings.hotelAr;
  COMPANY.nameEn = S.settings.hotelEn;
  saveCompanies();
}

const SEQ_PREFIX = { pr: 'PR', gr: 'GR', is: 'IS', tr: 'TR', cn: 'CN' };

let S = null;             // the whole application state (persisted as one JSON document)
let CURRENT = null;       // logged-in user object

const r4 = (v) => Math.round((Number(v) || 0) * 10000) / 10000;
const uniq = (arr) => Array.from(new Set(arr));

/* ----- Stock engine (weighted average cost; every change is a ledger movement) ----- */
const stockKey = (itemId, whId) => itemId + '|' + whId;
function bal(itemId, whId) { return S.stock[stockKey(itemId, whId)] || { qty: 0, avg: 0 }; }
function totalQty(itemId) {
  let q = 0;
  S.warehouses.forEach((w) => { q += bal(itemId, w.id).qty; });
  return r4(q);
}
function stockValue() {
  let v = 0;
  Object.keys(S.stock).forEach((k) => { const b = S.stock[k]; if (b.qty > 0) v += b.qty * b.avg; });
  return v;
}
function recordMove(m) {
  S.movements.push(Object.assign({ id: uid(), ts: nowIso(), date: todayISO(), user: CURRENT ? CURRENT.username : 'system' }, m));
}

/* Inbound: averages the cost of the stock on hand with the new lot. */
function stockIn({ itemId, whId, qty: q, unitCost, type, docNo, note, date }) {
  const k = stockKey(itemId, whId);
  const b = S.stock[k] || { qty: 0, avg: 0 };
  const item = itemOf(itemId);
  const cost = r4(num(unitCost) || (b.qty > 0 ? b.avg : 0) || (item ? item.cost : 0));
  const newQty = r4(b.qty + q);
  const newAvg = b.qty > 0 ? r4(((b.qty * b.avg) + (q * cost)) / (b.qty + q)) : cost;
  S.stock[k] = { qty: newQty, avg: newAvg };
  recordMove({ type, itemId, whId, qty: r4(q), cost, docNo: docNo || '', note: note || '', date: date || todayISO() });
  return cost;
}

/* Outbound: throws when stock is insufficient (unless negative stock is allowed). Returns unit cost used. */
function stockOut({ itemId, whId, qty: q, type, docNo, note, date }) {
  const k = stockKey(itemId, whId);
  const b = S.stock[k] || { qty: 0, avg: 0 };
  if (!S.settings.allowNegative && b.qty + 1e-9 < q) {
    throw new Error(t('msg.stockShort', { item: nm(itemOf(itemId)), avail: qty(b.qty) }));
  }
  const cost = r4(b.avg || (itemOf(itemId) ? itemOf(itemId).cost : 0));
  S.stock[k] = { qty: r4(b.qty - q), avg: b.avg };
  recordMove({ type, itemId, whId, qty: r4(-q), cost, docNo: docNo || '', note: note || '', date: date || todayISO() });
  return cost;
}

/* ----- Approval routing ----- */
function buildApprovalSteps(total) {
  const tiers = S.settings.tiers.slice().sort((a, b) => (a.upTo ?? Infinity) - (b.upTo ?? Infinity));
  const tier = tiers.find((tr) => tr.upTo === null || tr.upTo === undefined || total <= tr.upTo);
  const n = tier ? tier.levels : 0;
  const steps = [];
  for (let i = 0; i < n; i++) {
    steps.push({ level: i + 1, role: S.settings.chain[i] || 'manager', status: 'PENDING', by: null, at: null, note: '' });
  }
  return steps;
}

/* ----- Money / number helpers for documents ----- */
function lineTotal(qtyVal, cost) { return r4(num(qtyVal) * num(cost)); }

/* ===== Business documents: purchase requests, approvals, receipts, issues, transfers, counts ===== */

function requirePerm(p) {
  if (!can(p)) throw new Error(t('msg.noPerm'));
}

/* Validates item lines: at least one, positive quantities, no duplicate items. */
function cleanLines(rawLines, needCost) {
  const lines = (rawLines || []).filter((l) => l && l.itemId);
  if (!lines.length) throw new Error(t('msg.noLines'));
  const seen = new Set();
  return lines.map((l) => {
    if (!itemOf(l.itemId)) throw new Error(t('msg.pick'));
    if (seen.has(l.itemId)) throw new Error(t('msg.dupLine') + ': ' + nm(itemOf(l.itemId)));
    seen.add(l.itemId);
    const q = num(l.qty);
    if (!(q > 0)) throw new Error(t('msg.badQty') + ': ' + nm(itemOf(l.itemId)));
    const out = { itemId: l.itemId, qty: r4(q) };
    if (needCost) out.unitCost = r4(num(l.unitCost));
    return out;
  });
}

/* ----- Purchase requests ----- */
function savePR(data, submit) {
  requirePerm('pr.create');
  if (!data.deptId) throw new Error(t('msg.pickDept'));
  const lines = cleanLines(data.lines, false).map((l, i) => ({
    itemId: l.itemId, qty: l.qty, estCost: r4(num((data.lines || []).filter((x) => x && x.itemId)[i].estCost)), received: 0,
  }));
  let pr = data.id ? S.docs.pr.find((x) => x.id === data.id) : null;
  if (pr && pr.status !== 'DRAFT') throw new Error(t('msg.cannotEdit'));
  if (!pr) {
    pr = { id: uid(), no: nextDocNo('pr'), date: todayISO(), requesterId: CURRENT.id, status: 'DRAFT', steps: [], createdAt: nowIso() };
    S.docs.pr.push(pr);
  }
  pr.deptId = data.deptId;
  pr.neededBy = data.neededBy || '';
  pr.note = data.note || '';
  pr.lines = lines;
  pr.total = r4(lines.reduce((a, l) => a + l.qty * l.estCost, 0));
  if (submit) {
    pr.steps = buildApprovalSteps(pr.total);
    pr.status = pr.steps.length ? 'PENDING' : 'APPROVED';
    pr.submittedAt = nowIso();
    if (pr.status === 'APPROVED') pr.approvedAt = nowIso();
    audit('pr.submit', pr.no);
  } else {
    pr.status = 'DRAFT';
  }
  saveState();
  return pr;
}

function currentApprovalStep(pr) {
  return pr.steps.find((s) => s.status === 'PENDING') || null;
}
function canActOnStep(pr) {
  const step = currentApprovalStep(pr);
  if (!step || !CURRENT) return false;
  if (pr.requesterId === CURRENT.id) return false;
  if (!can('pr.approve')) return false;
  if (CURRENT.role === 'admin') return true;
  if (CURRENT.role !== step.role) return false;
  // a department manager with a department set only handles that department's requests
  if (step.role === 'manager' && CURRENT.deptId && CURRENT.deptId !== pr.deptId) return false;
  return true;
}

function decidePR(prId, approve, reason) {
  const pr = S.docs.pr.find((x) => x.id === prId);
  if (!pr || pr.status !== 'PENDING') throw new Error(t('msg.cannotEdit'));
  if (pr.requesterId === CURRENT.id) throw new Error(t('msg.selfApprove'));
  const step = currentApprovalStep(pr);
  if (!step) throw new Error(t('msg.cannotEdit'));
  if (!canActOnStep(pr)) throw new Error(t('msg.notYourStep'));
  if (approve && step.role === 'purchasing' && !pr.pricedAt) throw new Error(t('msg.mustPrice'));
  if (!approve && !String(reason || '').trim()) throw new Error(t('msg.needReason'));
  step.status = approve ? 'APPROVED' : 'REJECTED';
  step.by = CURRENT.id;
  step.at = nowIso();
  step.note = reason || '';
  if (!approve) {
    pr.status = 'REJECTED';
    audit('pr.reject', pr.no);
  } else if (pr.steps.every((s) => s.status === 'APPROVED')) {
    pr.status = 'APPROVED';
    pr.approvedAt = nowIso();
    audit('pr.approve', pr.no);
  } else {
    audit('pr.approve.step', pr.no + ' L' + step.level);
  }
  saveState();
  return pr;
}

/* Purchasing prices the request during its own step. The approval chain is fixed at submission, so repricing never changes it. */
function repricePR(prId, costs) {
  const pr = S.docs.pr.find((x) => x.id === prId);
  if (!pr || pr.status !== 'PENDING') throw new Error(t('msg.cannotEdit'));
  const step = currentApprovalStep(pr);
  if (!step || step.role !== 'purchasing' || !canActOnStep(pr)) throw new Error(t('msg.notYourStep'));
  pr.lines.forEach((l, i) => {
    const v = num(costs['c' + i]);
    if (!(v >= 0)) throw new Error(t('common.required'));
    l.estCost = r4(v);
  });
  pr.total = r4(pr.lines.reduce((a, l) => a + l.qty * l.estCost, 0));
  pr.pricedAt = nowIso();
  pr.pricedBy = CURRENT.id;
  audit('pr.reprice', pr.no + ' ' + pr.total);
  saveState();
  return pr;
}

/* ----- Goods receipts (optionally against an approved purchase request) ----- */
function postGR(data) {
  requirePerm('receipt.post');
  if (!data.whId) throw new Error(t('msg.pickWh'));
  const lines = cleanLines(data.lines, true);
  let pr = null;
  if (data.prId) {
    pr = S.docs.pr.find((x) => x.id === data.prId);
    if (!pr || (pr.status !== 'APPROVED' && pr.status !== 'PARTIAL')) throw new Error(t('msg.notApproved'));
    lines.forEach((l) => {
      const pl = pr.lines.find((x) => x.itemId === l.itemId);
      if (!pl) throw new Error(t('msg.noLines') + ': ' + nm(itemOf(l.itemId)));
      const remaining = r4(pl.qty - pl.received);
      if (l.qty > remaining + 1e-9) throw new Error(t('msg.overRemaining', { n: qty(remaining) }));
    });
  }
  const gr = {
    id: uid(), no: nextDocNo('gr'), date: data.date || todayISO(), supplierId: data.supplierId || '',
    whId: data.whId, prId: pr ? pr.id : null, invoice: data.invoice || '', note: data.note || '',
    lines: [], status: 'POSTED', user: CURRENT.username, createdAt: nowIso(),
  };
  lines.forEach((l) => {
    const cost = stockIn({ itemId: l.itemId, whId: gr.whId, qty: l.qty, unitCost: l.unitCost, type: 'RECEIPT', docNo: gr.no, note: gr.invoice, date: gr.date });
    gr.lines.push({ itemId: l.itemId, qty: l.qty, unitCost: cost });
  });
  if (pr) {
    pr.lines.forEach((pl) => {
      const got = gr.lines.find((x) => x.itemId === pl.itemId);
      if (got) pl.received = r4(pl.received + got.qty);
    });
    pr.status = pr.lines.every((pl) => pl.received + 1e-9 >= pl.qty) ? 'CLOSED' : 'PARTIAL';
  }
  S.docs.gr.push(gr);
  audit('gr.post', gr.no);
  saveState();
  return gr;
}

/* ----- Store issues (إذن صرف) ----- */
function checkAvailability(lines, whId) {
  lines.forEach((l) => {
    const avail = bal(l.itemId, whId).qty;
    if (!S.settings.allowNegative && avail + 1e-9 < l.qty) {
      throw new Error(t('msg.stockShort', { item: nm(itemOf(l.itemId)), avail: qty(avail) }));
    }
  });
}

function postIS(data) {
  requirePerm('issue.post');
  if (!data.whId) throw new Error(t('msg.pickWh'));
  if (!data.deptId) throw new Error(t('msg.pickDept'));
  const lines = cleanLines(data.lines, false);
  checkAvailability(lines, data.whId);
  const is = {
    id: uid(), no: nextDocNo('is'), date: data.date || todayISO(), whId: data.whId, deptId: data.deptId,
    receiver: data.receiver || '', note: data.note || '', lines: [], status: 'POSTED', user: CURRENT.username, createdAt: nowIso(),
  };
  lines.forEach((l) => {
    const cost = stockOut({ itemId: l.itemId, whId: is.whId, qty: l.qty, type: 'ISSUE', docNo: is.no, note: depOf(is.deptId) ? nm(depOf(is.deptId)) : '', date: is.date });
    is.lines.push({ itemId: l.itemId, qty: l.qty, unitCost: cost, value: r4(cost * l.qty) });
  });
  S.docs.is.push(is);
  audit('is.post', is.no);
  saveState();
  return is;
}

/* ----- Warehouse transfers ----- */
function postTR(data) {
  requirePerm('transfer.post');
  if (!data.fromWh) throw new Error(t('msg.pickFrom'));
  if (!data.toWh) throw new Error(t('msg.pickTo'));
  if (data.fromWh === data.toWh) throw new Error(t('tr.sameWh'));
  const lines = cleanLines(data.lines, false);
  checkAvailability(lines, data.fromWh);
  const tr = {
    id: uid(), no: nextDocNo('tr'), date: data.date || todayISO(), fromWh: data.fromWh, toWh: data.toWh,
    note: data.note || '', lines: [], status: 'POSTED', user: CURRENT.username, createdAt: nowIso(),
  };
  lines.forEach((l) => {
    const cost = stockOut({ itemId: l.itemId, whId: tr.fromWh, qty: l.qty, type: 'TRANSFER_OUT', docNo: tr.no, note: '', date: tr.date });
    stockIn({ itemId: l.itemId, whId: tr.toWh, qty: l.qty, unitCost: cost, type: 'TRANSFER_IN', docNo: tr.no, note: '', date: tr.date });
    tr.lines.push({ itemId: l.itemId, qty: l.qty, unitCost: cost });
  });
  S.docs.tr.push(tr);
  audit('tr.post', tr.no);
  saveState();
  return tr;
}

/* ----- Stock count: counted quantities are compared with the ledger and adjusted ----- */
function postCN(data) {
  requirePerm('count.post');
  if (!data.whId) throw new Error(t('msg.pickWh'));
  const rows = (data.lines || []).filter((l) => l && l.itemId && l.counted !== '' && l.counted !== null && l.counted !== undefined);
  if (!rows.length) throw new Error(t('msg.countNothing'));
  const cn = {
    id: uid(), no: nextDocNo('cn'), date: data.date || todayISO(), whId: data.whId, note: data.note || '',
    lines: [], status: 'POSTED', user: CURRENT.username, createdAt: nowIso(),
  };
  let adjusted = 0;
  rows.forEach((l) => {
    const system = bal(l.itemId, cn.whId).qty;
    const counted = r4(num(l.counted));
    const diff = r4(counted - system);
    cn.lines.push({ itemId: l.itemId, system, counted, diff });
    if (Math.abs(diff) > 1e-9) {
      adjusted++;
      if (diff > 0) stockIn({ itemId: l.itemId, whId: cn.whId, qty: diff, unitCost: 0, type: 'ADJUST', docNo: cn.no, note: 'count', date: cn.date });
      else stockOut({ itemId: l.itemId, whId: cn.whId, qty: -diff, type: 'ADJUST', docNo: cn.no, note: 'count', date: cn.date });
    }
  });
  S.docs.cn.push(cn);
  audit('cn.post', cn.no + ' (' + adjusted + ')');
  saveState();
  return { doc: cn, adjusted };
}

/* ----- Sample data (for trial / demonstration only) ----- */
function loadSampleData() {
  const main = S.warehouses.find((w) => w.code === 'MAIN');
  const fnb = S.warehouses.find((w) => w.code === 'FNB');
  const hk = S.warehouses.find((w) => w.code === 'HK');
  S.items.forEach((it, i) => {
    if (i % 9 === 4) return; // leave a few items at zero on purpose
    const base = Math.max(it.minStock * 3, 10);
    postOpening({ itemId: it.id, whId: main.id, qty: base, unitCost: it.cost });
    if (it.code.indexOf('FB-') === 0 || it.code.indexOf('BV-') === 0) postOpening({ itemId: it.id, whId: fnb.id, qty: Math.round(base / 2) || 1, unitCost: it.cost });
    if (it.code.indexOf('HK-') === 0 || it.code.indexOf('CL-') === 0) postOpening({ itemId: it.id, whId: hk.id, qty: Math.round(base / 3) || 1, unitCost: it.cost });
  });
  const items = S.items.slice(0, 3);
  const dept = S.departments.find((d) => d.code === 'HK') || S.departments[0];
  savePR({
    deptId: dept.id, neededBy: addDays(todayISO(), 7), note: 'طلب تجريبي / sample request',
    lines: items.map((it) => ({ itemId: it.id, qty: it.minStock * 2, estCost: it.cost })),
  }, true);
  audit('sample.load', 'sample data');
  saveState();
}

function renderRoute() {
  const r = parseHash();
  ROUTE.page = r.page;
  ROUTE.id = r.id;
  if (!$('#view')) { renderApp(); return; }
  const nav = NAV.flatMap((g) => g.items).find((it) => it[0] === r.page);
  let html;
  if (!nav && !PAGES[r.page]) {
    ROUTE.page = 'dashboard';
    html = PAGES.dashboard(null);
  } else if (!nav) {
    LIST.q = '';
    LIST.render = null;
    html = PAGES[r.page](r.id);
  } else if (!hasAny(nav[3])) {
    html = emptyBox(t('msg.noPerm'));
  } else {
    LIST.q = '';
    LIST.render = null;
    html = PAGES[r.page] ? PAGES[r.page](r.id) : emptyBox(t('common.noData'));
  }
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav button').forEach((b) => b.classList.toggle('active', b.dataset.to === ROUTE.page));
  const crumb = $('#crumb');
  const nav2 = NAV.flatMap((g) => g.items).find((it) => it[0] === ROUTE.page);
  if (crumb) crumb.textContent = nav2 ? t(nav2[1]) : '';
  window.scrollTo(0, 0);
}

const CHART_COLORS = ['#1f6feb', '#0ea5a4', '#f59e0b', '#8b5cf6', '#ef4444', '#10b981', '#64748b', '#ec4899'];

function barsSvg(labels, a, b, labelA, labelB) {
  const W = 640, H = 230, pl = 40, pb = 26, pt = 10;
  const max = Math.max(4, ...a, ...b);
  const n = labels.length;
  const slot = (W - pl - 10) / n;
  const bw = Math.max(3, slot * 0.34);
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const y = pt + (H - pt - pb) * (1 - k / 4);
    g += '<line class="grid-line" x1="' + pl + '" x2="' + (W - 6) + '" y1="' + y + '" y2="' + y + '"/>'
      + '<text x="' + (pl - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + Math.round(max * k / 4) + '</text>';
  }
  labels.forEach((lb, i) => {
    const x0 = pl + i * slot + slot * 0.14;
    const ha = (a[i] / max) * (H - pt - pb);
    const hb = (b[i] / max) * (H - pt - pb);
    g += '<rect x="' + x0 + '" y="' + (H - pb - ha) + '" width="' + bw + '" height="' + ha + '" rx="3" style="fill:var(--primary)"><title>' + lb + ' · ' + labelA + ': ' + a[i] + '</title></rect>';
    g += '<rect x="' + (x0 + bw + 2) + '" y="' + (H - pb - hb) + '" width="' + bw + '" height="' + hb + '" rx="3" style="fill:var(--accent)"><title>' + lb + ' · ' + labelB + ': ' + b[i] + '</title></rect>';
    if (i % 2 === 0) g += '<text x="' + (x0 + bw) + '" y="' + (H - 7) + '" text-anchor="middle">' + lb + '</text>';
  });
  return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="chart">' + g + '</svg>';
}
function donutSvg(parts, centerTop, centerBottom) {
  const size = 190, thick = 24;
  const r = (size - thick) / 2;
  const C = 2 * Math.PI * r;
  const total = parts.reduce((a, p) => a + p.value, 0);
  let off = 0;
  let g = '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" style="stroke:var(--surface-2)" stroke-width="' + thick + '"/>';
  if (total > 0) {
    parts.forEach((p) => {
      const len = (p.value / total) * C;
      if (len <= 0) return;
      g += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + p.color + '" stroke-width="' + thick
        + '" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"><title>' + esc(p.label) + '</title></circle>';
      off += len;
    });
  }
  g += '<text x="50%" y="46%" text-anchor="middle" style="font-size:12px;fill:var(--muted)">' + esc(centerTop) + '</text>'
    + '<text x="50%" y="58%" text-anchor="middle" style="font-size:15px;font-weight:800;fill:var(--text)">' + esc(centerBottom) + '</text>';
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" role="img" aria-label="donut">' + g + '</svg>';
}

PAGES.dashboard = () => {
  const today = todayISO();
  const month = today.slice(0, 7);
  const items = activeItems();
  const low = items.map((i) => ({ i, q: totalQty(i.id) }))
    .filter((x) => x.i.minStock > 0 && x.q < x.i.minStock)
    .sort((a, b) => (a.q - a.i.minStock) - (b.q - b.i.minStock));
  const pendingAll = S.docs.pr.filter((p) => p.status === 'PENDING');
  const mine = pendingAll.filter((p) => canActOnStep(p));
  const issuesToday = S.docs.is.filter((d) => d.date === today).length;
  const receiptsMonth = S.docs.gr.filter((d) => String(d.date).slice(0, 7) === month)
    .reduce((a, d) => a + d.lines.reduce((x, l) => x + l.qty * l.unitCost, 0), 0);

  /* 14-day movement chart (ledger lines in / out, opening balances excluded) */
  const days = [];
  for (let k = 13; k >= 0; k--) days.push(addDays(today, -k));
  const inC = days.map(() => 0);
  const outC = days.map(() => 0);
  S.movements.forEach((m) => {
    if (m.type === 'OPENING') return;
    const idx = days.indexOf(m.date);
    if (idx < 0) return;
    if (m.qty > 0) inC[idx]++; else outC[idx]++;
  });

  /* value by category */
  const catVal = {};
  let grand = 0;
  Object.keys(S.stock).forEach((k) => {
    const b = S.stock[k];
    if (!(b.qty > 0)) return;
    const itemId = k.split('|')[0];
    const item = itemOf(itemId);
    const cid = item ? item.categoryId : '';
    catVal[cid] = (catVal[cid] || 0) + b.qty * b.avg;
    grand += b.qty * b.avg;
  });
  const catParts = Object.keys(catVal).map((cid, i) => ({ label: nm(catOf(cid)) || '—', value: catVal[cid], color: CHART_COLORS[i % CHART_COLORS.length] }))
    .sort((a, b) => b.value - a.value);
  const topCats = catParts.slice(0, 6);
  const others = catParts.slice(6).reduce((a, p) => a + p.value, 0);
  if (others > 0) topCats.push({ label: t('common.all') + ' · ...', value: others, color: '#94a3b8' });

  /* issues by department (this month) */
  const deptVal = {};
  S.docs.is.filter((d) => String(d.date).slice(0, 7) === month).forEach((d) => {
    const v = d.lines.reduce((a, l) => a + l.qty * l.unitCost, 0);
    deptVal[d.deptId] = (deptVal[d.deptId] || 0) + v;
  });
  const deptRows = Object.keys(deptVal).map((id) => ({ name: deptName(id), v: deptVal[id] })).sort((a, b) => b.v - a.v);
  const deptMax = Math.max(1, ...deptRows.map((r) => r.v));

  /* value by warehouse */
  const whRows = S.warehouses.map((w) => {
    let v = 0;
    Object.keys(S.stock).forEach((k) => {
      const [, wid] = k.split('|');
      const b = S.stock[k];
      if (wid === w.id && b.qty > 0) v += b.qty * b.avg;
    });
    return { name: nm(w), v };
  });
  const whMax = Math.max(1, ...whRows.map((r) => r.v));

  /* recent activity */
  const feed = S.movements.slice(-10).reverse();
  const typeColor = { RECEIPT: '#10b981', ISSUE: '#ef4444', TRANSFER_OUT: '#f59e0b', TRANSFER_IN: '#0ea5a4', ADJUST: '#8b5cf6', OPENING: '#64748b' };

    + '<div class="kpi-icon">' + ico(icon) + '</div><div><div class="k-label">' + label + '</div>'
    + '<div class="k-value num">' + value + '</div><div class="k-hint">' + hint + '</div></div></div>';

  if (can('receipt.post')) quick.push('<button class="btn" data-act="nav" data-to="gr/new">' + ico('inn') + t('rc.new') + '</button>');
  if (can('issue.post')) quick.push('<button class="btn" data-act="nav" data-to="is/new">' + ico('out') + t('is.new') + '</button>');
  if (can('count.post')) quick.push('<button class="btn" data-act="nav" data-to="cn/new">' + ico('clip') + t('cn.new') + '</button>');

    { h: t('common.status'), c: (r) => stockBadge(r.q <= 0 ? 'out' : 'low') },

function approvalStepsHtml(pr) {

  const s = currentApprovalStep(pr);

  const rows = pr.lines.map((l, i) => '<tr><td style="text-align:start">' + esc(nm(itemOf(l.itemId))) + '</td><td class="num">' + qty(l.qty)

  const lines = pr.lines.map((l) => {
    const it = itemOf(l.itemId);

    actions.push('<button class="btn success" data-act="prApprove" data-id="' + pr.id + '">' + ico('check') + t('common.approve') + '</button>');
    actions.push('<button class="btn danger" data-act="prReject" data-id="' + pr.id + '">' + t('common.reject') + '</button>');

  if (pr.status === 'APPROVED' || pr.status === 'PARTIAL') {

  return pageHead(pr.no, actions.join('') + '<button class="btn" data-act="print">' + t('common.print') + '</button><button class="btn ghost" data-act="back">' + t('common.back') + '</button>', statusBadge(pr.status))

function fieldValueText(f, r) {
  if (f.kind === 'ref') {
    const tgt = ENT[f.ref].coll().find((x) => x.id === r[f.k]);
    return tgt ? (f.rkey === 'code' ? tgt.code + ' — ' + nm(tgt) : tgt[f.rkey]) : '—';
  }
  if (f.kind === 'bool') return r[f.k] === false ? t('common.inactive') : t('common.active');
  if (f.kind === 'num') return qty(r[f.k]);
  if (f.kind === 'role') return t('role.' + r.role);
  if (f.kind === 'pass') return '';
  return r[f.k] ?? '';
}
function entCell(f, r) {
  if (f.kind === 'bool') return '<span class="badge ' + (r[f.k] === false ? 'bad' : 'ok') + '">' + (r[f.k] === false ? t('common.inactive') : t('common.active')) + '</span>';
  return esc(fieldValueText(f, r));
}

/* ----- Persistence of entity records ----- */
function isReferenced(name, id) {
  const sources = {
    categories: [S.items],
    items: [S.movements, S.docs],
    warehouses: [S.movements, S.docs],
    departments: [S.docs, S.users],
    suppliers: [S.docs],
    users: [S.docs],
  }[name] || [];
  return sources.some((s) => JSON.stringify(s).indexOf('"' + id + '"') !== -1);
}

async function entSave(name, id, v) {
  const E = ENT[name];
  const list = E.coll();
  const rec = id ? list.find((x) => x.id === id) : null;
  const key = String(v[E.key] ?? '').trim();
  if (!key) throw new Error(t('common.required') + ': ' + t(E.fields.find((f) => f.k === E.key).l));
  if (list.some((x) => (!rec || x.id !== rec.id) && eqi(x[E.key], key))) throw new Error(t('xl.dupKey', { k: key }));
  E.fields.forEach((f) => {
    if (f.req && f.kind !== 'bool' && f.kind !== 'pass' && String(v[f.k] ?? '').trim() === '') {
      throw new Error(t('common.required') + ': ' + t(f.l));
    }
    if (f.kind === 'role' && ROLES.indexOf(v[f.k]) === -1) throw new Error(t('common.required') + ': ' + t(f.l));
    if (f.kind === 'ref' && v[f.k]) {
      const isId = ENT[f.ref].coll().some((x) => x.id === v[f.k]);
      if (!isId && String(v[f.k]).indexOf('@') !== 0) throw new Error(t('xl.unknownRef', { c: v[f.k] }));
    }
  });
  const target = rec ? Object.assign({}, rec) : { id: uid(), createdAt: nowIso() };
  E.fields.forEach((f) => {
    if (f.kind === 'pass') return;
    if (f.kind === 'bool') target[f.k] = v[f.k] !== false;
    else if (f.kind === 'num') target[f.k] = num(v[f.k]);
    else if (f.kind === 'ref') {
      const raw = String(v[f.k] || '');
      if (raw.indexOf('@') === 0) {
        const tgt = ENT[f.ref].coll().find((x) => eqi(x[f.rkey], raw.slice(1)));
        if (!tgt) throw new Error(t('xl.unknownRef', { c: raw.slice(1) }));
        target[f.k] = tgt.id;
      } else target[f.k] = raw;
    } else target[f.k] = typeof v[f.k] === 'string' ? v[f.k].trim() : (v[f.k] ?? '');
  });

  if (name === 'users') {
    const pw = String(v.password || '');
    if (!rec && pw.length < 6) throw new Error(t('auth.short'));
    if (rec && pw && pw.length < 6) throw new Error(t('auth.short'));
    const wasAdmin = !!rec && rec.role === 'admin' && rec.active !== false;
    const willAdmin = target.role === 'admin' && target.active !== false;
    const otherAdmins = list.filter((u) => u.role === 'admin' && u.active !== false && (!rec || u.id !== rec.id));
    if (wasAdmin && !willAdmin && otherAdmins.length === 0) throw new Error(t('usr.cannotDisableAdmin'));
    if (rec && CURRENT && rec.id === CURRENT.id && target.active === false) throw new Error(t('usr.cannotDeleteSelf'));
    if (pw) target.pass = await makePasswordRecord(pw);
    if (!rec) { target.lastLogin = null; target.mustChange = !!v.mustChange; }
  }

  if (rec) list[list.findIndex((x) => x.id === rec.id)] = target;
  else list.push(target);
  if (name === 'users' && CURRENT && CURRENT.id === target.id) CURRENT = target;
  audit(rec ? 'master.update' : 'master.create', name + ': ' + key);
  saveState();
  return target;
}

function entDelete(name, id) {
  const E = ENT[name];
  const list = E.coll();
  const rec = list.find((x) => x.id === id);
  if (!rec) return 'none';
  if (name === 'users') {
    if (CURRENT && CURRENT.id === id) throw new Error(t('usr.cannotDeleteSelf'));
    const others = S.users.filter((u) => u.role === 'admin' && u.active !== false && u.id !== id);
    if (rec.role === 'admin' && rec.active !== false && others.length === 0) throw new Error(t('usr.cannotDisableAdmin'));
  }
  if (isReferenced(name, id)) {
    rec.active = false;
    audit('master.deactivate', name + ': ' + rec[E.key]);
    saveState();
    return 'deactivated';
  }
  list.splice(list.indexOf(rec), 1);
  audit('master.delete', name + ': ' + rec[E.key]);
  saveState();
  return 'deleted';
}

function entFormModal(name, rec) {
  const E = ENT[name];
  const inputs = E.fields.map((f) => {
    const val = rec ? rec[f.k] : undefined;
    const lab = t(f.l) + (f.req ? ' *' : '');
    if (f.kind === 'bool') {
      const on = rec ? rec[f.k] !== false : true;
      return '<label class="field inline" style="grid-column:1/-1"><input type="checkbox" name="' + f.k + '"' + (on ? ' checked' : '') + '> ' + lab + '</label>';
    }
    if (f.kind === 'ref') {
      return field(lab, sel(f.k, opt(ENT[f.ref].coll(), (x) => x[f.rkey] + ' — ' + nm(x), t('msg.pick')), val || ''));
    }
    if (f.kind === 'role') return field(lab, sel(f.k, ROLES.map((r) => ({ v: r, l: t('role.' + r) })), val || 'requester'));
    if (f.kind === 'pass') return field(rec ? t('usr.newPassword') : lab + ' (' + t('auth.short') + ')', '<input type="password" name="' + f.k + '" autocomplete="new-password">');
    if (f.kind === 'num') return field(lab, '<input type="number" step="any" min="0" name="' + f.k + '" value="' + esc(val ?? 0) + '">');
    return field(lab, '<input name="' + f.k + '" value="' + esc(val ?? '') + '"' + (f.req ? ' required' : '') + '>');
  }).join('');
  openModal({
    title: (rec ? t('common.edit') : t('common.add')) + ' · ' + t(E.title),
    body: '<form id="ent-form" class="form-grid">' + inputs + '</form>',
    actions: [
      { label: t('common.cancel'), cls: 'ghost', onClick: () => {} },
      { label: t('common.save'), cls: 'primary', onClick: async (ctx) => {
        const v = readForm(ctx.el.querySelector('#ent-form'));
        await entSave(name, rec ? rec.id : null, v);
        toast(t('common.saved'));
        renderRoute();
      } },
    ],
  });
}

function entPage(name) {
  const E = ENT[name];
  if (!can(E.view)) return emptyBox(t('msg.noPerm'));
  const cols = E.fields.filter((f) => f.kind !== 'pass').map((f) => ({ h: t(f.l), c: (r) => entCell(f, r), num: f.kind === 'num' }));
  if (can(E.perm)) {
    cols.push({ h: t('common.actions'), c: (r) => '<button class="btn sm" data-act="entEdit" data-ent="' + name + '" data-id="' + r.id + '">' + t('common.edit') + '</button> '
      + '<button class="btn sm danger" data-act="entDelete" data-ent="' + name + '" data-id="' + r.id + '">' + t('common.delete') + '</button>' });
  }
  LIST.render = (q) => {
    const k = String(q || '').trim().toLowerCase();
    const rows = E.coll().filter((r) => !k || E.fields.some((f) => f.kind !== 'pass' && String(fieldValueText(f, r)).toLowerCase().indexOf(k) !== -1));
    return table(cols, rows);
  };
  const actions = (can(E.perm)

function entExportRows(name) {
  const E = ENT[name];
  const fields = E.fields.filter((f) => f.kind !== 'pass');
  const head = fields.map((f) => f.x);
  const body = E.coll().map((r) => fields.map((f) => {
    const v = r[f.k];
    if (f.kind === 'ref') { const tgt = ENT[f.ref].coll().find((x) => x.id === v); return tgt ? tgt[f.rkey] : ''; }
    if (f.kind === 'bool') return v === false ? 0 : 1;
    if (f.kind === 'num') return num(v);
    if (f.kind === 'role') return v || '';
    return v ?? '';
  }));
  return [head].concat(body);
}
